# Configuration commune aux microservices (comme application.properties dans la vidéo)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
management.endpoints.web.exposure.include=health,refresh

# Valeurs de démonstration globales utilisées dans la vidéo
global.params.p1=456
global.params.p2=224

# Réglages H2 communs aux services de données
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
