spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: false
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/customers/**
            - id: customer-data-rest
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**
            - id: ebank-service
              uri: lb://ebank-service
              predicates:
                - Path=/accounts/**
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/products/**
            - id: inventory-data-rest
              uri: lb://inventory-service
              predicates:
                - Path=/api/products/**
            - id: billing-service
              uri: lb://billing-service
              predicates:
                - Path=/bills/**
